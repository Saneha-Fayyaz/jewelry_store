services:
  - type: web
    name: jewelry-store
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true  # Render will auto-generate a secure key
      - key: CATALOG_PATH
        value: /opt/render/project/src/catalog.json
      - key: DB_PATH
        value: /opt/render/project/src/jewelry_store.db